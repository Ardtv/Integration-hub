# Фрагмент для server{} с доменом хаба (HTTPS уже настроен certbot'ом).
# Вебхуки принимают секрет в адресе, поэтому журнал запросов для них отключён.

location = /webhook/amo {
    access_log off;
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /webhook/cdek {
    access_log off;
    proxy_pass http://127.0.0.1:3003;
    proxy_set_header X-Real-IP $remote_addr;
}

# Панель контроля и её API. Доступ по токену; при желании ограничьте по IP (allow/deny).
location = /hub/panel { proxy_pass http://127.0.0.1:3001/panel; }
location /hub/api/admin/ { proxy_pass http://127.0.0.1:3001/api/admin/; }

# /api/events наружу не публикуется: коннекторы обращаются к хабу по 127.0.0.1.
